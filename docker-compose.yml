services:
  postgres:
    image: postgres:16
    container_name: vigil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      - "5432:5432"
    volumes:
      - vigil-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vigil-redis
    restart: unless-stopped
    ports:
      # Host port 6380, not 6379 - avoids clashing with any other local
      # redis instance already bound to the default port on this machine.
      - "6380:6379"
    volumes:
      - vigil-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: vigil-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      # Host port 8082 - 8081 is already taken by something else on this
      # machine.
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  vigil-postgres-data:
  vigil-redis-data:
